name: Build Windows Complete Offline Installer

on:
  # Also run automatically when the complete-build workflow/download helper changes.
  # This lets a verified update produce a fresh All-In-One artifact from main.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows-complete.yml"
      - "scripts/**"
      - "core/**"
      - "desktop/**"
      - "tests/**"
      - "installer/**"
      - "requirements.txt"
      - "requirements-desktop.txt"
      - "requirements-voice-hq.txt"
  workflow_dispatch:
    inputs:
      presenter_adapter_url:
        description: "Link público do adapter_model.safetensors (Google Drive compartilhado ou URL direta). A versão v0.1 validada é o padrão."
        required: true
        default: "https://drive.google.com/file/d/1A3r0_51u3O1-rWZ-yOsMBlS4FNPiCEbH/view?usp=drivesdk"
        type: string

concurrency:
  group: agcn-windows-complete-installer
  cancel-in-progress: true

jobs:
  build-complete:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: .
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle trained AGCN Presenter v0.1
        shell: pwsh
        env:
          # On push, workflow_dispatch inputs are absent; use the public v0.1 Drive share.
          PRESENTER_ADAPTER_URL: ${{ inputs.presenter_adapter_url || 'https://drive.google.com/file/d/1A3r0_51u3O1-rWZ-yOsMBlS4FNPiCEbH/view?usp=drivesdk' }}
        run: |
          python -m pip install safetensors numpy requests
          if ([string]::IsNullOrWhiteSpace("$env:PRESENTER_ADAPTER_URL") -or "$env:PRESENTER_ADAPTER_URL" -notmatch '^https?://') {
            throw "Informe uma URL HTTP/HTTPS válida do adapter_model.safetensors."
          }
          python scripts\download_drive_file.py "$env:PRESENTER_ADAPTER_URL" "adapter_model.safetensors"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "adapter_model.safetensors")) {
            throw "Não foi possível baixar/validar o adapter. Confira se o arquivo do Google Drive está acessível a qualquer pessoa com o link."
          }
          $sourceHash = (Get-FileHash -Algorithm SHA256 "adapter_model.safetensors").Hash.ToLower()
          if ($sourceHash -ne "5652197ef5f1bc212822d071ed28cd5a9802fea62aa3f5f802e88896486a6524") { throw "Presenter adapter SHA256 mismatch: $sourceHash" }
          python scripts\convert_agcn_presenter_v01_to_gguf.py "adapter_model.safetensors" --output "brain_local\models\AGCN-Presenter-v0.1-F16.gguf"
          $gguf = Get-Item "brain_local\models\AGCN-Presenter-v0.1-F16.gguf"
          $ggufHash = (Get-FileHash -Algorithm SHA256 $gguf.FullName).Hash.ToLower()
          if ($gguf.Length -ne 66095008) { throw "Presenter GGUF size mismatch: $($gguf.Length)" }
          if ($ggufHash -ne "19298caf2b03b90fbbc215786df16e5ea83fa005dc9a595125cac20376585ee5") { throw "Presenter GGUF SHA256 mismatch: $ggufHash" }
          Remove-Item "adapter_model.safetensors" -Force
          Write-Host "AGCN Presenter v0.1 bundled: $($gguf.Length) bytes / $ggufHash"

      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-desktop.txt
          python -m pip install -r requirements-voice-hq.txt
          python -m pip install pytest pyinstaller safetensors numpy

      - name: Run repository tests
        shell: pwsh
        run: |
          python -m pytest -q

      - name: Download Kokoro fallback
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "models\kokoro" | Out-Null
          curl.exe -L --fail --retry 3 "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx" -o "models\kokoro\kokoro-v1.0.onnx"
          curl.exe -L --fail --retry 3 "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin" -o "models\kokoro\voices-v1.0.bin"

      - name: Build Qwen3-TTS HQ engine
        shell: pwsh
        run: |
          git clone --recursive --depth 1 https://github.com/ServeurpersoCom/qwentts.cpp.git vendor\qwentts.cpp
          cmake -S vendor\qwentts.cpp -B vendor\qwentts.cpp\build -A x64
          cmake --build vendor\qwentts.cpp\build --config Release -j 4

      - name: Assemble HQ voice pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "voice_hq\bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "voice_hq\models" | Out-Null
          New-Item -ItemType Directory -Force -Path "voice_hq\licenses" | Out-Null
          Copy-Item "vendor\qwentts.cpp\build\Release\tts-server.exe" "voice_hq\bin\" -Force
          Get-ChildItem "vendor\qwentts.cpp\build\Release" -Filter "*.dll" | Copy-Item -Destination "voice_hq\bin" -Force
          curl.exe -L --fail --retry 3 "https://huggingface.co/Serveurperso/Qwen3-TTS-GGUF/resolve/main/qwen-talker-1.7b-customvoice-Q8_0.gguf?download=true" -o "voice_hq\models\qwen-talker-1.7b-customvoice-Q8_0.gguf"
          curl.exe -L --fail --retry 3 "https://huggingface.co/Serveurperso/Qwen3-TTS-GGUF/resolve/main/qwen-tokenizer-12hz-Q8_0.gguf?download=true" -o "voice_hq\models\qwen-tokenizer-12hz-Q8_0.gguf"
          if (Test-Path "vendor\qwentts.cpp\LICENSE") { Copy-Item "vendor\qwentts.cpp\LICENSE" "voice_hq\licenses\qwentts.cpp-LICENSE.txt" -Force }

      - name: Download llama.cpp Windows runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "brain_local\bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "brain_local\models" | Out-Null
          New-Item -ItemType Directory -Force -Path "brain_local\licenses" | Out-Null
          $llamaTag = "b11264"
          $llamaAsset = "llama-b11264-bin-win-cpu-x64.zip"
          $llamaUrl = "https://github.com/ggml-org/llama.cpp/releases/download/$llamaTag/$llamaAsset"
          Write-Host "Using pinned llama.cpp runtime: $llamaTag / $llamaAsset"
          curl.exe -L --fail --retry 3 $llamaUrl -o "llama-win-x64.zip"
          if ((Get-Item "llama-win-x64.zip").Length -lt 10000000) { throw "llama.cpp runtime download is unexpectedly small" }
          Expand-Archive -Path "llama-win-x64.zip" -DestinationPath "llama_release" -Force
          $server = Get-ChildItem "llama_release" -Recurse -Filter "llama-server.exe" | Select-Object -First 1
          if (-not $server) { throw "llama-server.exe not found in release" }
          Copy-Item "$($server.Directory.FullName)\*" "brain_local\bin\" -Recurse -Force
          curl.exe -L --fail --retry 3 "https://raw.githubusercontent.com/ggml-org/llama.cpp/master/LICENSE" -o "brain_local\licenses\llama.cpp-LICENSE.txt"

      - name: Download Qwen3 4B local Brain
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 "https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf?download=true" -o "brain_local\models\Qwen3-4B-Q4_K_M.gguf"
          curl.exe -L --fail --retry 3 "https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/LICENSE" -o "brain_local\licenses\Qwen3-LICENSE.txt"
          $model = Get-Item "brain_local\models\Qwen3-4B-Q4_K_M.gguf"
          if ($model.Length -lt 2000000000) { throw "Qwen3 model download is unexpectedly small: $($model.Length)" }
          Write-Host "Qwen3 Brain model bytes: $($model.Length)"

      - name: Smoke bundled local Brain
        shell: pwsh
        run: |
          python -c "import json; from core.local_llama_brain import LlamaCppLocalTransport; p=LlamaCppLocalTransport(pack_dir='brain_local',require_lora=True,startup_timeout_seconds=180,timeout_seconds=120,max_output_tokens=120); print(p.assets_status()); assert p.assets_status()[0]; assert p.lora_active; assert '--lora' in p._command(); ok,msg=p.healthcheck(); print(msg); assert ok; assert 'Presenter v0.1' in msg; raw=p.complete(system_instruction='Responda em JSON conforme o schema. Seja curto.',user_payload='Crie uma fala de teste sem fatos comerciais. topic deve ser test, used_facts vazio, needs_fact false e next_sales_thread benefits.'); data=json.loads(raw); print(data); assert data.get('speech'); assert data.get('needs_fact') is False; p.close()"

      - name: Smoke HQ voice assets
        shell: pwsh
        run: |
          python -c "from core.local_qwen3_tts import Qwen3HQLocalTTSProvider; p=Qwen3HQLocalTTSProvider(pack_dir='voice_hq',profile_id='female_fast',speed=1.0,startup_timeout_seconds=180); print(p.assets_status()); assert p.assets_status()[0]"

      - name: Synthesize Vivian and Ryan
        shell: pwsh
        run: |
          python -c "from core.local_qwen3_tts import Qwen3HQLocalTTSProvider; p=Qwen3HQLocalTTSProvider(pack_dir='voice_hq',profile_id='female_fast',speed=1.0,startup_timeout_seconds=180,request_timeout_seconds=180); a=p.synthesize('Oferta confirmada em reais para esta live.'); print('Vivian bytes',len(a.data)); assert len(a.data)>24000; p.close()"
          python -c "from core.local_qwen3_tts import Qwen3HQLocalTTSProvider; p=Qwen3HQLocalTTSProvider(pack_dir='voice_hq',profile_id='male_fast',speed=1.0,startup_timeout_seconds=180,request_timeout_seconds=180); a=p.synthesize('Oferta confirmada em reais para esta live.'); print('Ryan bytes',len(a.data)); assert len(a.data)>24000; p.close()"

      - name: Build AGCN Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "AGCN Live Voice" --paths . --add-data "models\kokoro;models\kokoro" --collect-all TikTokLive --collect-all keyring --collect-all kokoro_onnx --collect-all espeakng_loader --collect-all phonemizer --collect-all onnxruntime --collect-all imageio_ffmpeg desktop\main.py

      - name: Add local Brain and HQ voice to application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\AGCN Live Voice\_internal\brain_local" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist\AGCN Live Voice\_internal\voice_hq" | Out-Null
          Copy-Item "brain_local\*" "dist\AGCN Live Voice\_internal\brain_local\" -Recurse -Force
          Copy-Item "voice_hq\*" "dist\AGCN Live Voice\_internal\voice_hq\" -Recurse -Force
          if (!(Test-Path "dist\AGCN Live Voice\_internal\brain_local\bin\llama-server.exe")) { throw "Local Brain engine missing" }
          if (!(Test-Path "dist\AGCN Live Voice\_internal\brain_local\models\Qwen3-4B-Q4_K_M.gguf")) { throw "Local Brain model missing" }
          if (!(Test-Path "dist\AGCN Live Voice\_internal\brain_local\models\AGCN-Presenter-v0.1-F16.gguf")) { throw "AGCN Presenter v0.1 adapter missing" }
          if (!(Test-Path "dist\AGCN Live Voice\_internal\voice_hq\bin\tts-server.exe")) { throw "HQ voice engine missing" }
          if (!(Test-Path "dist\AGCN Live Voice\_internal\voice_hq\models\qwen-talker-1.7b-customvoice-Q8_0.gguf")) { throw "HQ voice model missing" }

      - name: Smoke packaged executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\AGCN Live Voice\AGCN Live Voice.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "AGCN executable exited early. ExitCode=$($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Prepare offline Windows prerequisite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "installer_payload" | Out-Null
          curl.exe -L --fail --retry 3 "https://aka.ms/vs/17/release/vc_redist.x64.exe" -o "installer_payload\vc_redist.x64.exe"
          if ((Get-Item "installer_payload\vc_redist.x64.exe").Length -lt 10000000) { throw "VC++ runtime download is unexpectedly small" }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Free temporary build space
        shell: pwsh
        run: |
          Remove-Item "vendor" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "voice_hq" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "brain_local" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "llama_release" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "llama-win-x64.zip" -Force -ErrorAction SilentlyContinue
          python -m pip cache purge

      - name: Build complete offline installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "installer\AGCN-Live-Voice.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Get-ChildItem "installer_output" | Select-Object Name,Length

      - name: Verify complete installer payload
        shell: pwsh
        run: |
          if (!(Test-Path "installer_output\AGCN-Live-Voice-Setup.exe")) { throw "Setup executable missing" }
          $parts = Get-ChildItem "installer_output"
          $total = ($parts | Measure-Object -Property Length -Sum).Sum
          if ($total -lt 3000000000) { throw "Complete installer is unexpectedly small: $total" }
          Write-Host "Complete offline installer bytes: $total"

      - name: Upload complete installer
        uses: actions/upload-artifact@v4
        with:
          name: AGCN-Live-Voice-All-In-One-Presenter-v0.1
          path: installer_output/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
