name: Portal customers smoke tests

on:
  push:
    branches: [main]
    paths:
      - "backend/portal_app.py"
      - "web/test_portal.py"
      - "web/portal.css"
      - ".github/workflows/test-portal.yml"
  workflow_dispatch:

jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.28,<1" "pytest>=8,<10" "uvicorn>=0.30,<1"
      - run: python -m compileall -q backend/portal_app.py
      - run: python -m pytest -q web/test_portal.py
