name: Publish Live Voice site screenshots

on:
  push:
    branches: [site]
    paths:
      - "web/screenshots/*.html"
      - "web/render_previews.py"
      - ".github/workflows/generate-site-previews.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install screenshot tools
        run: |
          python -m pip install --disable-pip-version-check "playwright>=1.48,<2" "pillow>=11,<13"
          python -m playwright install --with-deps chromium
      - name: Generate real WebP images from existing 1600x900 UI mockups
        run: python web/render_previews.py
      - name: Commit screenshots back to site branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/screenshots/images/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(site): render consistent AGCN Live Voice screenshots"
            git push origin HEAD:site
          fi
