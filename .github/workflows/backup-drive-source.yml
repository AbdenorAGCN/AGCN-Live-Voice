name: Backup GitHub main - codigo e historico
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-drive-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Obter todo o historico Git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Empacotar codigo e historico
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          git archive --format=zip --output backup/codigo-fonte-main.zip HEAD
          git bundle create backup/historico-git.bundle --all
          {
            echo "Repositorio: $GITHUB_REPOSITORY"
            echo "Branch: main"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Data (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Conteudo: codigo-fonte-main.zip + historico-git.bundle"
            echo "O backup inclui apenas arquivos versionados no GitHub e o historico Git."
            echo "Nao inclui dados privados do Railway, volumes, segredos ou arquivos locais nao versionados."
          } > backup/LEIA-ME.txt
          (cd backup && sha256sum codigo-fonte-main.zip historico-git.bundle LEIA-ME.txt > SHA256SUMS.txt)
      - name: Salvar snapshot ZIP para transferencia ao Drive
        uses: actions/upload-artifact@v4
        with:
          name: BACKUP-GITHUB-MAIN
          path: backup/
          if-no-files-found: error
          retention-days: 30
